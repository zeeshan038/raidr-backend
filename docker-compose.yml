# Development stack — safe to run on the same VPS as ~/raidr-backend-prod.
# Uses unique container names, host ports, and Compose project name so prod is untouched.
name: raidr-dev

services:
  api:
    build: .
    container_name: raidr_api_dev
    ports:
      - "5002:5001"
      - "3002:3001"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://raidr_user:raidr_password@postgres:5432/raidr_db
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always

  postgres:
    image: postgres:15-alpine
    container_name: raidr_postgres_dev
    environment:
      POSTGRES_USER: raidr_user
      POSTGRES_PASSWORD: raidr_password
      POSTGRES_DB: raidr_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raidr_user -d raidr_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:alpine
    container_name: raidr_redis_dev
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    restart: always

volumes:
  postgres_data:
  redis_data:
