name: Deploy to Hetzner

on:
  push:
    branches:
      - main
      - zeeshan-dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into Hetzner & Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          script: |
            if [ "${{ github.ref_name }}" == "main" ]; then
              TARGET_DIR="/root/raidr-backend-prod"
            else
              TARGET_DIR="/root/raidr-backend"
            fi
            
            echo "Deploying branch ${{ github.ref_name }} to $TARGET_DIR"
            cd $TARGET_DIR
            git pull origin ${{ github.ref_name }}
            # Dev MUST use docker-compose.dev.yml — plain `docker compose up` reuses project
            # name `raidr-backend-prod` and container names (raidr_postgres, …) and can hijack prod.
            if [ "${{ github.ref_name }}" == "main" ]; then
              sh scripts/compose-prod-up.sh
            else
              chmod +x scripts/compose-dev-up.sh
              sh scripts/compose-dev-up.sh
            fi
